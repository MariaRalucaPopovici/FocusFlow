{% extends "base.html" %}

{% block title %}
Edit Brain Dump Entry | FocusFlow
{% endblock %}

{% block content %}

<h2>Edit Entry</h2>

<form method="POST" class="task-form">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions">
        <button type="submit" class="button-primary">Save Changes</button>
        <a href="{% url 'journal_list' %}" class="button-secondary">Cancel</a>
    </div>
</form>

{% endblock %}
