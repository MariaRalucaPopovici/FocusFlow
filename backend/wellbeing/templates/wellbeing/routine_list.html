{% extends "base.html" %}
{% load static %}

{% block title %}
Routines | FocusFlow
{% endblock %}

{% block content %}

<div class="page-heading">
    <div>
        <h2>Routines</h2>
        <p>Step-by-step routines to guide you through common parts of your day.</p>
    </div>

    <a href="{% url 'add_routine' %}" class="button-primary"> + Add Routine</a>
</div>

<input type="search" id="routine-search" class="search-input" placeholder="Search routines..." autocomplete="off"
    data-search-url="{% url 'routine_search' %}">

<div id="routine-list" class="routine-grid">
    {% include "wellbeing/_routine_cards.html" %}
</div>

<script src="{% static 'wellbeing/routine_search.js' %}" defer></script>

{% endblock %}
