{% extends "base.html" %}

{% block title %}
Delete Brain Dump Entry | FocusFlow
{% endblock %}

{% block content %}

<div class="delete-confirmation">
    <h2>Delete Entry</h2>
    <p>Are you sure you want to delete this journal entry? This can't be undone.</p>

    <div class="form-actions">
        <form method="POST" class="delete-form">
            {% csrf_token %}
            <button type="submit" class="button-danger">Yes, Delete</button>
        </form>
        <a href="{% url 'journal_list' %}" class="button-secondary">Cancel</a>
    </div>
</div>

{% endblock %}
