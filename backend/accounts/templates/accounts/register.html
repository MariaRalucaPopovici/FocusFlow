{% extends "base.html" %}
{% load socialaccount %}

{% block title %}
Register | FocusFlow
{% endblock %}

{% block content %}

<div class="auth-card">
    <h2>Register</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="form-field">
            <label for="uname"><b>Username</b></label>
            <input type="text" placeholder="Enter Username" name="uname" value="{{ old_username }}" required>
        </div>

        <div class="form-field">
            <label for="mail"><b>Email</b></label>
            <input type="email" placeholder="Enter Email" name="mail" value="{{ old_email }}" required>
        </div>

        <div class="form-field">
            <label for="pass"><b>Password</b></label>
            <input type="password" placeholder="Enter Password" name="pass" required>
        </div>

        <div class="form-field">
            <label for="pass2"><b>Confirm password</b></label>
            <input type="password" placeholder="Confirm password" name="pass2" required>
        </div>

        <button type="submit" class="button-primary">Register</button>
    </form>

    <div class="or-divider">or</div>

    <a href="{% provider_login_url 'google' %}" class="button-secondary">Sign up with Google</a>
</div>

{% endblock %}
