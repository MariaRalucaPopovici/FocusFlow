{% extends "base.html" %}
{% load socialaccount %}

{% block title %}
Login | FocusFlow
{% endblock %}

{% block content %}

<div class="auth-card">
    <h2>Login</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="form-field">
            <label><b>Username</b></label>
            <input type="text" name="uname" required>
        </div>

        <div class="form-field">
            <label><b>Password</b></label>
            <input type="password" name="psw" required>
        </div>

        <button type="submit" class="button-primary">Login</button>
    </form>

    <div class="or-divider">or</div>

    <a href="{% provider_login_url 'google' %}" class="button-secondary">Sign in with Google</a>
</div>

{% endblock %}
