{% extends "base.html" %}

{% block title %}
Login | FocusFlow
{% endblock %}

{% block content %}

<form method="POST">

{% csrf_token %}

<div class="container">
    <label><b>Username</b></label>
    <input type="text" name="uname" required>

    <label><b>Password</b></label>
    <input type="password" name="psw" required>

    <button type="submit">Login</button>
</div>

</form>

{% endblock %}
